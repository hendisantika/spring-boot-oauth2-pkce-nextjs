spring:
  application:
    name: oauth2-pkce
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/oauth2_pkce?preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:oauth2}
    password: ${DB_PASSWORD:oauth2}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      lifecycle-management: start-only

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    issuer: ${APP_ISSUER:http://localhost:8080}
    cors-allowed-origins:
      - ${APP_FRONTEND_URL:http://localhost:3000}
    public-client:
      client-id: ${APP_CLIENT_ID:pkce-client}
      client-name: PKCE Public Client
      redirect-uris:
        - ${APP_FRONTEND_URL:http://localhost:3000}/api/auth/callback
        - http://127.0.0.1:8080/authorized
      post-logout-redirect-uris:
        - ${APP_FRONTEND_URL:http://localhost:3000}
      scopes:
        - openid
        - profile
        - email
        - notes.read
        - notes.write
      access-token-ttl: 15m
      require-consent: false
  seed:
    admin:
      enabled: ${APP_SEED_ADMIN:true}
      username: ${APP_ADMIN_USERNAME:admin}
      password: ${APP_ADMIN_PASSWORD:admin123}
      email: ${APP_ADMIN_EMAIL:admin@example.com}

logging:
  level:
    org.springframework.security: INFO
