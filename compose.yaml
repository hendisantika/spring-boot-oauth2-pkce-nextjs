services:
  mysql:
    image: mysql:8.4
    container_name: oauth2-pkce-mysql
    environment:
      MYSQL_DATABASE: oauth2_pkce
      MYSQL_USER: oauth2
      MYSQL_PASSWORD: oauth2
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
